[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gm-auth"
version = "0.1.3"
description = "Reusable GoodMorning authentication and identity module"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "pydantic>=2.7,<3",
  "pydantic-settings>=2.5,<3",
  "PyJWT>=2.9,<3",
  "SQLAlchemy>=2.0,<3",
]

[tool.setuptools.packages.find]
include = ["gm_auth*"]
